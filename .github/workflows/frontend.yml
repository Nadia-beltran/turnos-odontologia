name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "design-system/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "design-system/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Reglas duras (sin innerHTML ni any)
        run: npm run check:reglas

      - name: Tests
        run: npm test

      - name: Build (tsc --noEmit + vite build)
        run: npm run build
