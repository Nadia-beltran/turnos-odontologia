name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Los tests de integración se omiten sin Docker (AbstractIntegrationTest).
      # En CI Docker es obligatorio: si no está, el job falla en vez de saltearlos en silencio.
      - name: Verificar Docker para Testcontainers
        run: docker info --format '{{.ServerVersion}}'

      - name: Build y tests
        run: ./gradlew build --console=plain

      - name: Publicar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests-backend
          path: backend/build/reports/tests/test
          retention-days: 7
