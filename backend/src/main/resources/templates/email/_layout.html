<!DOCTYPE html>
<!-- Fragmentos comunes de los emails (design D6). Sin imágenes remotas: solo texto y estilos en línea. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="encabezado" style="font-family: sans-serif; padding: 8px 0;">
    <strong th:text="${consultorio != null} ? ${consultorio} : ${marca}">Consultorio</strong>
</header>
<footer th:fragment="pie" style="font-family: sans-serif; font-size: 12px; color: #666; padding-top: 16px;">
    <small>
        <span th:if="${consultorio != null}" th:text="${consultorio} + ' vía ' + ${marca}">Consultorio vía Estudio Sonrisa</span>
        <span th:unless="${consultorio != null}" th:text="${marca}">Estudio Sonrisa</span>
        · herramienta de turnos
    </small>
</footer>
</body>
</html>
