# Estudio Sonrisa: configuración del backend.
# Variables de entorno: knowledge-base/08_arquitectura_propuesta.md §Variables de entorno.
# Nunca poner secretos reales en este archivo (ver .env.example).

spring:
  application:
    name: backend
  profiles:
    default: dev
  mvc:
    problemdetails:
      enabled: true            # errores RFC 9457 (spec api-errors)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # el esquema lo crea Flyway, nunca Hibernate (DD-13)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC       # se guarda en UTC (RN-EX-02)
  mail:
    properties:
      mail.smtp.connectiontimeout: 10000   # ms; acota el envío con filas bloqueadas (design D3)
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true  # detecta migraciones modificadas (spec schema-migrations)

app:
  timezone-default: ${APP_TIMEZONE_DEFAULT:America/Argentina/Buenos_Aires}
  brand-name: Estudio Sonrisa   # nombre del producto en remitente y pie de los emails (DD-14)
  tick:
    programado: true            # false en tests: la tarea programada no compite con ellos
    intervalo: PT5M
  mail:
    lote: 20                    # máximo de emails por corrida del procesador

---
# Desarrollo local: PostgreSQL y Mailpit de docker-compose.yml
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/turnos}
    username: ${SPRING_DATASOURCE_USERNAME:turnos}
    password: ${SPRING_DATASOURCE_PASSWORD:turnos}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${APP_MAIL_FROM:Estudio Sonrisa <no-reply@localhost>}
    daily-quota: ${APP_MAIL_DAILY_QUOTA:300}

---
# Producción: sin valores por defecto para datos de conexión ni secretos.
# Si falta una variable obligatoria, el arranque falla (design D6).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}

app:
  base-url: ${APP_BASE_URL}
  mail:
    from: ${APP_MAIL_FROM}
    daily-quota: ${APP_MAIL_DAILY_QUOTA}
  internal-tick-secret: ${APP_INTERNAL_TICK_SECRET}
  admin:
    email: ${APP_ADMIN_EMAIL}
    password: ${APP_ADMIN_PASSWORD}
